name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          coverage: none

      - name: Configure Fury auth
        run: |
          echo '{"http-basic":{"php.fury.io":{"username":"${{ secrets.GEMFURY_TOKEN }}","password":""}}}' \
            > ~/.composer/auth.json

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Test
        run: composer test

      - name: Lint
        run: composer lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Fury
        env:
          GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          git push --force "https://${GEMFURY_USER}:${GEMFURY_TOKEN}@git.fury.io/${GITHUB_REPOSITORY}.git" HEAD:master --tags
